name: Translate update posts

on:
  push:
    branches: [main]
    paths:
      - 'updates/**/post.md'
      - 'updates/**/post-en.md'
      - 'scripts/translate-updates.mjs'
      - '.github/workflows/translate-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-updates
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Les marqueurs .i18n.<lang>.hash sont l'état du travail déjà fait. Un run
      # relancé (« Re-run jobs ») repart du commit qui l'avait déclenché : à cet
      # endroit les marqueurs n'existent pas encore, et le script retraduisait
      # les ~800 fichiers au lieu des seules traductions manquantes. On se place
      # donc toujours sur la dernière version de main, où cet état est présent.
      - name: Travailler depuis la dernière version de main
        run: |
          git fetch --no-tags origin main
          git reset --hard origin/main
          echo "État des traductions lu depuis $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # continue-on-error : une langue en échec ne doit pas jeter à la poubelle
      # les traductions déjà produites (le job durait des heures et rien n'était
      # jamais commité). Les fichiers réussis sont marqués par .i18n.<lang>.hash,
      # donc un nouvel essai ne refait que ce qui manque.
      - name: Translate update posts
        id: translate
        continue-on-error: true
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_ENDPOINT: ${{ vars.TRANSLATE_ENDPOINT }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: node scripts/translate-updates.mjs

      - name: Commit generated translations and index
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A updates
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          # Pas de « [skip ci] » ici : Netlify annule le déploiement de tout commit
          # qui contient ce marqueur, donc les traductions n'arrivaient jamais en
          # ligne. Ce commit ne relance pas ce workflow de toute façon : il ne
          # touche que des post.<lang>.md, des .i18n.*.hash et index.json, alors
          # que les déclencheurs ne visent que post.md / post-en.md / le script.
          git commit -m "chore(updates): auto-translate posts and rebuild index"
          # main a pu bouger pendant la traduction : on rebase et on retente.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push refusé (tentative $attempt), mise à jour depuis origin/main…"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "Impossible de pousser les traductions." >&2
          exit 1

      # Le job reste rouge si des traductions ont échoué, même si les autres
      # ont bien été commitées.
      - name: Fail if some translations could not be generated
        if: steps.translate.outcome == 'failure'
        run: |
          echo "Certaines traductions ont échoué ; voir le log de l'étape précédente." >&2
          exit 1
