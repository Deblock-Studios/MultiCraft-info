name: Translate update posts

on:
  push:
    branches: [main]
    paths:
      - 'updates/**/post.md'
      - 'updates/**/post-en.md'
      - 'scripts/translate-updates.mjs'
      - '.github/workflows/translate-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-updates
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Un seul fournisseur : VyceAI. Le script essaie le premier modèle, puis
    # descend la liste tant qu'aucun ne répond vraiment. Dès qu'un modèle
    # fonctionne, il est utilisé seul pour toutes les traductions du run
    # (« sticky model ») et mémorisé pour les runs suivants.
    env:
      TRANSLATE_PROVIDER: vyceai
      TRANSLATE_API_KEY: ${{ secrets.VYCEAI_API_KEY }}
      TRANSLATE_ENDPOINT: ${{ vars.VYCEAI_ENDPOINT }}
      # Modèle primaire
      TRANSLATE_MODEL: glm-5.3-flash
      # Modèles de secours, dans l'ordre
      TRANSLATE_MODEL_FALLBACKS: "nemotron-3.5-super-vl,gpt-oss-120b,wave"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Travailler depuis la dernière version de main
        run: |
          git fetch --no-tags origin main
          git reset --hard origin/main
          echo "État des traductions lu depuis $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier VyceAI
        continue-on-error: true
        run: node scripts/translate-updates.mjs --check

      - name: Translate update posts
        id: translate
        continue-on-error: true
        run: node scripts/translate-updates.mjs

      - name: Commit generated translations and index
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A updates
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(updates): auto-translate posts and rebuild index"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push refusé (tentative $attempt), mise à jour depuis origin/main…"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "Impossible de pousser les traductions." >&2
          exit 1

      - name: Fail if some translations could not be generated
        if: steps.translate.outcome == 'failure'
        run: |
          echo "Certaines traductions ont échoué ; voir le log de l'étape précédente." >&2
          exit 1
